name: Deploy to GitHub Pages

# Manual trigger only for now, plus push to main — this is still a draft
# under client review, so it does not auto-deploy on every push to a
# feature branch. Run it by hand from the Actions tab (Run workflow) when
# you want the preview link updated.
#
# Two more triggers keep the static export in step with Sanity:
#   - repository_dispatch (type "sanity-publish"): fired by a Sanity webhook
#     whenever an editor publishes, so content changes go live in a minute or two.
#   - schedule: a daily rebuild, so events roll from "upcoming" to "past" on
#     their own — that split is computed at build time.
on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Repo is served from https://mihany.github.io/CrockettFoundation/,
          # so every asset and internal link needs this prefix.
          NEXT_PUBLIC_BASE_PATH: /CrockettFoundation
          # Public identifiers, not secrets (they appear in every image URL).
          NEXT_PUBLIC_SANITY_PROJECT_ID: enimvzp7
          NEXT_PUBLIC_SANITY_DATASET: production
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
