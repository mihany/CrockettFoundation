name: Deploy to GitHub Pages

# Manual trigger only for now, plus push to main — this is still a draft
# under client review, so it does not auto-deploy on every push to a
# feature branch. Run it by hand from the Actions tab (Run workflow) when
# you want the preview link updated.
#
# Two more triggers keep the static export in step with Sanity:
#   - repository_dispatch (type "sanity-publish"): fired by a Sanity webhook
#     whenever an editor publishes, so content changes go live in a minute or two.
#   - schedule: a daily rebuild, so events roll from "upcoming" to "past" on
#     their own — that split is computed at build time.
on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Served from the root of the custom domain
          # (https://crockettfoundationdc.org/), so no base path. If the custom
          # domain is ever removed, set NEXT_PUBLIC_BASE_PATH: /CrockettFoundation
          # here so the site works under https://mihany.github.io/CrockettFoundation/.
          # Public identifiers, not secrets (they appear in every image URL).
          NEXT_PUBLIC_SANITY_PROJECT_ID: enimvzp7
          NEXT_PUBLIC_SANITY_DATASET: production
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing (which also feeds DuckDuckGo, Yahoo, Ecosia and ChatGPT search),
  # Yandex, Seznam and Naver about every URL in the sitemap right after a
  # deploy, instead of waiting for them to recrawl. Skipped on the daily
  # scheduled rebuild, which rarely changes content. The key is public by
  # design: serving public/<KEY>.txt proves domain ownership. Best effort —
  # a failure here never fails the deploy.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          HOST: crockettfoundationdc.org
          KEY: c3d16e0cadca5b6aa93414ec28ae495b
        run: |
          urls=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -s .)
          jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' \
            | curl -fsS -X POST "https://api.indexnow.org/indexnow" \
                -H "Content-Type: application/json; charset=utf-8" --data-binary @-
